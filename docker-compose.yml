services:
  web:
    # Extract scripts/prepare-release.mjs output into this directory first.
    build:
      context: ${RELEASE_SOURCE_DIR:?Set RELEASE_SOURCE_DIR to a verified Git release archive}
    container_name: quarterly-recon-web
    command: npx wrangler dev --config dist/server/wrangler.json --ip 0.0.0.0 --port 3000 --persist-to .wrangler
    ports:
      - "8000:3000"
    restart: always
    environment:
      - NODE_ENV=production
    volumes:
      - app-data:/app/.wrangler
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  app-data:
