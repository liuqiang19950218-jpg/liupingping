apiVersion: batch/v1
kind: Job
metadata:
  name: quarterly-recon-db-migrate-v001
  namespace: quarterly-recon
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: quarterly-recon-data-secrets
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              export PGPASSWORD="$POSTGRES_PASSWORD"
              psql -v ON_ERROR_STOP=1 \
                -h quarterly-recon-postgresql \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" \
                -f /migrations/001_foundation.sql
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: quarterly-recon-db-migrations
