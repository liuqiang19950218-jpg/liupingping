apiVersion: v1
kind: Service
metadata:
  name: quarterly-recon-postgresql
  namespace: quarterly-recon
spec:
  selector:
    app: quarterly-recon-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quarterly-recon-postgresql
  namespace: quarterly-recon
spec:
  serviceName: quarterly-recon-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: quarterly-recon-postgresql
  template:
    metadata:
      labels:
        app: quarterly-recon-postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            - -c
            - max_connections=160
            - -c
            - shared_buffers=256MB
            - -c
            - timezone=Asia/Shanghai
          envFrom:
            - secretRef:
                name: quarterly-recon-data-secrets
          ports:
            - containerPort: 5432
              name: postgresql
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/quarterly-recon/postgresql
            type: DirectoryOrCreate
