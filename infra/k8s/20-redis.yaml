apiVersion: v1
kind: Service
metadata:
  name: quarterly-recon-redis
  namespace: quarterly-recon
spec:
  selector:
    app: quarterly-recon-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quarterly-recon-redis
  namespace: quarterly-recon
spec:
  serviceName: quarterly-recon-redis
  replicas: 1
  selector:
    matchLabels:
      app: quarterly-recon-redis
  template:
    metadata:
      labels:
        app: quarterly-recon-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          envFrom:
            - secretRef:
                name: quarterly-recon-data-secrets
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/quarterly-recon/redis
            type: DirectoryOrCreate
