# 仅作为字段模板。复制到服务器后替换全部 CHANGE_ME，禁止提交真实密码。
apiVersion: v1
kind: Secret
metadata:
  name: quarterly-recon-data-secrets
  namespace: quarterly-recon
type: Opaque
stringData:
  POSTGRES_DB: quarterly_recon
  POSTGRES_USER: quarterly_recon
  POSTGRES_PASSWORD: CHANGE_ME_POSTGRES_PASSWORD
  DATABASE_URL: postgresql://quarterly_recon:CHANGE_ME_POSTGRES_PASSWORD@quarterly-recon-postgresql:5432/quarterly_recon
  REDIS_URL: redis://:CHANGE_ME_REDIS_PASSWORD@quarterly-recon-redis:6379/0
  REDIS_PASSWORD: CHANGE_ME_REDIS_PASSWORD
  MINIO_ROOT_USER: quarterly-recon
  MINIO_ROOT_PASSWORD: CHANGE_ME_MINIO_PASSWORD
  MINIO_ENDPOINT: http://quarterly-recon-minio:9000
  MINIO_BUCKET: quarterly-recon-files
